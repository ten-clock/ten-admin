# Playground：push main 后构建镜像并部署到腾讯云（Docker）
#
# 在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置：
#   DEPLOY_HOST          服务器 IP 或域名
#   DEPLOY_USER          SSH 用户名（如 root、ubuntu）
#   DEPLOY_SSH_KEY       SSH 私钥全文（PEM）
#   GHCR_PULL_TOKEN      拉取私有镜像用 PAT（scope: read:packages）；公开 Package 可省略
#
# 可选 Variables：
#   DEPLOY_CONTAINER_PORT  宿主机端口，默认 80（映射容器 8080）
#
name: Deploy Playground Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: ten-admin-playground

concurrency:
  group: deploy-playground-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build image and deploy
    if: >-
      github.event.repository.name == 'ten-admin'
      && github.actor != 'dependabot[bot]'
      && (github.event_name == 'workflow_dispatch'
        || !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/deploy/Dockerfile.playground
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on Tencent Cloud server
        uses: appleboy/ssh-action@v1.2.2
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ vars.DEPLOY_CONTAINER_PORT || '80' }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 45m
          envs: REGISTRY,IMAGE,CONTAINER_NAME,HOST_PORT,GHCR_PULL_TOKEN,GHCR_USER
          script: |
            set -e
            if docker info >/dev/null 2>&1; then
              DOCKER=docker
            elif sudo docker info >/dev/null 2>&1; then
              DOCKER="sudo docker"
            else
              echo "Cannot access Docker. Run: sudo usermod -aG docker $USER && re-login"
              exit 1
            fi
            echo "==> login ghcr.io"
            if [ -n "$GHCR_PULL_TOKEN" ]; then
              echo "$GHCR_PULL_TOKEN" | $DOCKER login "$REGISTRY" -u "$GHCR_USER" --password-stdin
            fi
            echo "==> pull $IMAGE (may take several minutes from China)"
            $DOCKER pull "$IMAGE"
            echo "==> restart container"
            $DOCKER stop "$CONTAINER_NAME" 2>/dev/null || true
            $DOCKER rm "$CONTAINER_NAME" 2>/dev/null || true
            $DOCKER run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "${HOST_PORT}:8080" \
              "$IMAGE"
            $DOCKER image prune -f
            echo "==> deploy done"