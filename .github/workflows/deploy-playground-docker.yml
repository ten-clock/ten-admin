# Playground：push main 后在 GHA 构建 dist，上传到腾讯云并在服务器本地 docker build（方案 2，无需 TCR/GHCR pull）
#
# 流程：
#   1. pnpm build:play
#   2. 打包 dist + nginx.conf + Dockerfile.playground.runtime
#   3. SCP 到 CVM，docker build → run（仅首次或 nginx 基础层变更时需拉 Docker Hub）
#
# Secrets：
#   DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY
#
# Variables：
#   DEPLOY_CONTAINER_PORT  默认 8090 → 容器 8080
#   DEPLOY_REMOTE_DIR      默认 /var/tmp/ten-admin-playground（上传与构建目录）
#
name: Deploy Playground Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTAINER_NAME: ten-admin-playground
  IMAGE_NAME: ten-admin-playground
  DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || '/var/tmp/ten-admin-playground' }}

concurrency:
  group: deploy-playground-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build dist and deploy on server
    if: >-
      github.event.repository.name == 'ten-admin'
      && github.actor != 'dependabot[bot]'
      && (github.event_name == 'workflow_dispatch'
        || !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build playground
        run: pnpm run build:play

      - name: Pack deploy bundle
        run: |
          rm -rf deploy-bundle deploy-bundle.tar.gz
          mkdir -p deploy-bundle/playground
          cp -r playground/dist deploy-bundle/playground/dist
          cp scripts/deploy/nginx.conf deploy-bundle/nginx.conf
          cp scripts/deploy/Dockerfile.playground.runtime deploy-bundle/Dockerfile
          tar czf deploy-bundle.tar.gz -C deploy-bundle .

      - name: Upload bundle to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy-bundle.tar.gz
          target: ${{ env.DEPLOY_REMOTE_DIR }}

      - name: Build image and restart container on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_REMOTE_DIR }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ vars.DEPLOY_CONTAINER_PORT || '8090' }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: DEPLOY_DIR,IMAGE,CONTAINER_NAME,HOST_PORT,DEPLOY_SHA
          script: |
            set -e
            if docker info >/dev/null 2>&1; then
              DOCKER=docker
            elif sudo docker info >/dev/null 2>&1; then
              DOCKER="sudo docker"
            else
              echo "Cannot access Docker. Run: sudo usermod -aG docker $USER && re-login"
              exit 1
            fi
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            tar xzf deploy-bundle.tar.gz
            RUNNING_IMAGE=""
            if $DOCKER inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
              RUNNING_IMAGE=$($DOCKER inspect --format '{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)
            fi
            if [ "$RUNNING_IMAGE" = "$IMAGE" ]; then
              echo "==> skip: container already runs $IMAGE"
              exit 0
            fi
            echo "==> docker build $IMAGE (local, no registry pull)"
            $DOCKER build -t "$IMAGE" -f Dockerfile .
            echo "==> restart container"
            $DOCKER stop "$CONTAINER_NAME" 2>/dev/null || true
            $DOCKER rm "$CONTAINER_NAME" 2>/dev/null || true
            $DOCKER run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "${HOST_PORT}:8080" \
              "$IMAGE"
            $DOCKER image prune -f
            echo "==> deploy done"